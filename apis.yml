name: Useful Sensors
description: 'Useful Sensors, now operating as Moonshine AI, builds fast, low-resource,
  private-by-design AI that runs entirely on-device. Founded by former Google TensorFlow
  leads Pete Warden (CEO) and Manjunath Kudlur (CTO), the company started with plug-and-play
  hardware like the Person Sensor and Tiny Code Reader and now ships Moonshine, an
  MIT-licensed family of low-latency speech-to-text, text-to-speech, and intent-recognition
  models with SDKs for in-browser JavaScript, server-side Python, and C++ on edge
  devices. There is no hosted cloud API — all speech processing happens locally on
  the device.'
